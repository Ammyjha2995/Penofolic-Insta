name: 1. Daily draft (8 AM carousel)

on:
  schedule:
    - cron: "33 1 * * *"   # 07:03 IST: draft ready well before 8 AM (GitHub cron is UTC and can run late)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency: feedbot-draft

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get install -y -qq libraqm0 >/dev/null || true
      - run: pip install -q -r requirements.txt

      - name: Fetch news, write and render the carousel
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m feedbot draft --kind carousel

      - name: Commit slides
        if: steps.draft.outputs.folder != ''
        run: |
          git config user.name "penofolic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue state
          git commit -m "Draft: ${{ steps.draft.outputs.folder }}"
          git pull --rebase -q && git push -q

      - name: Open approval issue
        if: steps.draft.outputs.folder != ''
        id: issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m feedbot open-issue --folder "${{ steps.draft.outputs.folder }}"

      - name: Auto-publish (only if repository variable AUTO_PUBLISH = true)
        if: steps.draft.outputs.folder != '' && vars.AUTO_PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python -m feedbot publish --issue "${{ steps.issue.outputs.issue }}"
          git add state && git commit -m "Published ${{ steps.draft.outputs.folder }}" && git pull --rebase -q && git push -q || true
